# SCOPE FIREWALL — only targets listed here can be scanned.
#
# Two ways to authorize targets:
#
# 1. LEGACY simple list (recon only — exploitation-class tools always refused):
# allowed_hosts:
#   - scanme.nmap.org
#
# 2. RICH POLICY LIST — full per-target control (lab AND live-authorized):
#
# targets:
#   - host: <ip_or_domain_or_cidr>
#     authorized: true
#     environment: lab | live_authorized
#     allowed_tools: [nmap, gobuster, nikto, sqlmap, hydra, wpscan, commix]
#     forbidden_tools: []                      # hard-blocked for this target
#     program_rules_url: https://...           # optional, live_authorized bug bounty
#     rate_limit: low | medium                 # optional
#
# Notes:
# - exploitation-class tools (sqlmap/hydra/wpscan/commix/metasploit) are refused
#   UNLESS environment: lab — no exceptions, even if allowed_tools lists them.
# - if allowed_tools is empty/omitted for a rich entry, recon tools are allowed
#   and exploitation-class tools follow the environment rule.
# - DO NOT add entries here unless you are authorized to test the target.
# - Add your lab VM / bug-bounty entries yourself once confirmed reachable.

allowed_hosts:
  - scanme.nmap.org        # Nmap's official authorized practice host
  # - 192.168.56.101       # your Metasploitable VM (uncomment + edit)

targets:
  # DVWA lab — Docker container on this Kali VM (host port 8080 -> container :80).
  # Authorized by the project owner as an isolated lab target.
  - host: 127.0.0.1
    authorized: true
    environment: lab
    allowed_tools: [nmap, gobuster, nikto, sqlmap, hydra, wpscan, commix]

denied_hosts:
  - localhost
  # 127.0.0.1 intentionally NOT denied: explicitly authorized above as the DVWA lab.
